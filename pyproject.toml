[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "24/7 autonomous crypto trading agent: code-owned risk, model-judged reflex"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "numpy>=1.26",
    "ccxt>=4.5,<5",
    "anthropic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
